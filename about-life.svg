<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="410" viewBox="0 0 900 410" role="img"><style>.d{font-family:Impact,Haettenschweiler,'Arial Narrow Bold','Helvetica Neue',Arial,sans-serif;font-weight:800;fill:#f2f4fa}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#8fa0bf}.s{font-family:Arial,Helvetica,sans-serif;fill:#8fa0bf}.b{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#f2f4fa}@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}@keyframes up{from{transform:translateY(110px)}to{transform:none}}.in{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}@media (prefers-reduced-motion:reduce){.in,.up{animation:none!important}}</style><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><pattern id="adots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1a2540"/></pattern></defs><rect width="900" height="410" fill="#070b16"/><rect width="900" height="410" fill="url(#adots)"/><rect x="0" y="0" width="630.0" height="4" fill="#247bff"/><rect x="630.0" y="0" width="270.0" height="4" fill="#ff354f"/><rect x="40" y="40" width="410" height="330" rx="22" fill="#0e1628" stroke="url(#ag)" stroke-opacity=".55" stroke-width="1.5" /><text x="68" y="100" class="d" style="font-size:36px">What I build</text><g class="in" style="animation-delay:0.2s"><rect x="68" y="128" width="5" height="40" rx="2.5" fill="#247bff"/><text x="88" y="146" class="b" style="font-size:19px">AI &amp; machine learning</text><text x="88" y="166" class="s" style="font-size:14px">TensorFlow, OpenCV, LangChain, Hugging Face</text></g><g class="in" style="animation-delay:0.35s"><rect x="68" y="184" width="5" height="40" rx="2.5" fill="#ff354f"/><text x="88" y="202" class="b" style="font-size:19px">Backend &amp; APIs</text><text x="88" y="222" class="s" style="font-size:14px">Java, Spring Boot, Flask, REST design</text></g><g class="in" style="animation-delay:0.5s"><rect x="68" y="240" width="5" height="40" rx="2.5" fill="#247bff"/><text x="88" y="258" class="b" style="font-size:19px">Full-stack web</text><text x="88" y="278" class="s" style="font-size:14px">React, Next.js, MySQL</text></g><g class="in" style="animation-delay:0.6499999999999999s"><rect x="68" y="296" width="5" height="40" rx="2.5" fill="#ff354f"/><text x="88" y="314" class="b" style="font-size:19px">Document automation</text><text x="88" y="334" class="s" style="font-size:14px">Quadient Inspire at DBP Offshore</text></g><rect x="480" y="40" width="380" height="330" rx="22" fill="#0e1628" stroke="url(#ag)" stroke-opacity=".55" stroke-width="1.5" /><g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.3333;0.3453;1.0000" values="1;1;0;0"/><text x="512" y="150" class="m" style="font-size:14px;fill:#ff354f">Interest 1 of 3</text><text x="510" y="214" class="d" style="font-size:40px">Volleyball</text><text x="512" y="256" class="s" style="font-size:16px">Captained the Ranjeet House</text><text x="512" y="280" class="s" style="font-size:16px">volleyball team at PSIT.</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.3333;0.3453;0.6667;0.6787;1.0000" values="0;0;1;1;0;0"/><text x="512" y="150" class="m" style="font-size:14px;fill:#ff354f">Interest 2 of 3</text><text x="510" y="214" class="d" style="font-size:40px">Problem solving</text><text x="512" y="256" class="s" style="font-size:16px">50+ SQL problems on LeetCode</text><text x="512" y="280" class="s" style="font-size:16px">and DSA practice in Python.</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.6667;0.6787;1.0000" values="0;0;1;1"/><text x="512" y="150" class=